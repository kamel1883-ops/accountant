<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جداره Finance — معاينة بوابة المالك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E1B4B;--navy3:#151340;--gold:#C6A15B;--gold2:#E7D6AD;--soft:#F3E9D2;--bg:#F6F5F1;--sf:#fff;--tx:#1E1B33;--mu:#6C6A82;--ln:#E7E5DE;--ok:#1E7A52;--bad:#B3492B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131226;--sf:#1C1A3A;--tx:#EFEEF7;--mu:#A6A3C2;--ln:#332F5C;--soft:#2E2850}}
:root[data-theme="dark"]{--bg:#131226;--sf:#1C1A3A;--tx:#EFEEF7;--mu:#A6A3C2;--ln:#332F5C;--soft:#2E2850}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal','DejaVu Sans',system-ui,sans-serif;min-height:100vh}
.url{background:var(--navy3);color:#cfcdea;font-size:12px;padding:7px 14px;direction:ltr;text-align:left;font-family:ui-monospace,monospace}.url b{color:var(--gold2)}
.center{min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:30px;width:100%;max-width:380px}
.logo{width:50px;height:50px;border-radius:13px;background:var(--navy);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.box h1{text-align:center;margin:0;font-size:19px}.box .s{text-align:center;color:var(--mu);font-size:12px;margin:2px 0 18px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
input,select{width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;font-size:13.5px;margin-bottom:11px}
.btn{width:100%;background:var(--navy);color:#fff;border:0;border-radius:9px;padding:11px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.gold{background:var(--gold);color:var(--navy);border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.lnk{font-size:12px;color:var(--mu);text-decoration:underline;cursor:pointer}
.msg{background:var(--soft);border-radius:9px;padding:9px 12px;font-size:12.5px;margin:10px 0}
.app{display:flex;min-height:calc(100vh - 32px)}
aside{width:224px;flex:0 0 224px;background:var(--navy);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.br{display:flex;align-items:center;gap:10px}.lg{width:38px;height:38px;border-radius:10px;background:var(--navy3);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center}
.br b{font-size:15px;display:block;line-height:1.2}.br small{color:var(--gold2);font-size:11px}
nav{display:flex;flex-direction:column;gap:2px}nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-size:13.5px;color:rgba(255,255,255,.82)}nav button:hover{background:rgba(255,255,255,.08)}nav button.on{background:var(--gold);color:var(--navy);font-weight:800}
.out{margin-top:auto;font-size:12px;color:rgba(255,255,255,.55);text-decoration:underline;cursor:pointer}
main{flex:1;padding:24px 28px;min-width:0}h2{margin:0;font-size:21px}.sub{color:var(--mu);font-size:13px;margin:2px 0 16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:16px 18px;margin-bottom:14px}.card.warn{border-color:var(--gold)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}.kp div{background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:14px}.kp span{color:var(--mu);font-size:12px}.kp b{display:block;font-size:20px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500;font-size:12px}
.pill{font-size:11.5px;font-weight:800;padding:2px 10px;border-radius:20px;background:var(--soft)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:9px;padding:7px 15px;font:inherit;font-size:13px;cursor:pointer}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}.frm input,.frm select{margin:0}
.lead{border-bottom:1px solid var(--ln);padding:12px 0}.lead:last-child{border:0}.lead small{color:var(--mu)}
@media(max-width:820px){.app{flex-direction:column}aside{width:100%;flex:none;flex-direction:row;overflow-x:auto;align-items:center;padding:10px}.br{flex:0 0 auto}nav{flex-direction:row}nav button{white-space:nowrap}.out{display:none}main{padding:16px}}
</style>
</head>
<body>
<div class="url">https://<b>your-domain.com/owner-portal</b></div>

<div id="login" class="center"><div class="box" id="lbox"></div></div>

<div id="app" class="app" style="display:none">
  <aside>
    <div class="br"><span class="lg"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C6A15B" stroke-width="1.6"><path d="M3 8l4 4 5-7 5 7 4-4-2 10H5L3 8z"/></svg></span><span><b>جداره</b><small>بوابة المالك</small></span></div>
    <nav id="nav"></nav><span class="out" onclick="show('login')">تسجيل الخروج</span>
  </aside>
  <main id="view"></main>
</div>

<script>
const $=id=>document.getElementById(id);
const tbl=(h,r)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const head=(t,s)=>`<h2>${t}</h2><p class="sub">${s}</p>`;
const tabs=a=>`<div class="tabs">${a.map((x,i)=>`<button class="${i?'':'on'}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${x}</button>`).join('')}</div>`;
const alertMsg=()=>alert('معاينة بيانات تجريبية — في النظام الفعلي يُنفَّذ الإجراء ويُرسل البريد للعميل');
const soon=n=>n<=7?`<b class="bad">${n} يوم</b>`:`${n} يوم`;

function loginBox(mode){
  const logo='<div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C6A15B" stroke-width="1.6"><path d="M3 8l4 4 5-7 5 7 4-4-2 10H5L3 8z"/></svg></div>';
  if(mode==='forgot') return logo+`<h1>استعادة كلمة مرور المالك</h1><div class="s">يُرسل الرابط إلى بريد المالك المعتمد فقط</div><label>البريد الإلكتروني</label><input value="someone-else@gmail.com" dir="ltr"><div id="fm"></div><button class="btn" onclick="$('fm').innerHTML='<div class=msg>إذا كان البريد هو بريد المالك المعتمد فقد أرسلنا إليه رابط الاستعادة.</div>'">إرسال الرابط</button><p style="text-align:center;margin:14px 0 0"><span class="lnk" onclick="$('lbox').innerHTML=loginBox('login')">العودة لتسجيل الدخول</span></p><p class="s" style="margin:12px 0 0">مهما كان البريد المكتوب، الرد واحد؛ ولا يصل الرابط إلا لبريدك السرّي.</p>`;
  return logo+`<h1>بوابة المالك</h1><div class="s">دخول مخصص لمالك المنصة فقط</div><label>البريد الإلكتروني</label><input value="owner@your-domain.com" dir="ltr"><label>كلمة المرور</label><input type="password" value="••••••••••••"><div style="margin-bottom:14px"><span class="lnk" onclick="$('lbox').innerHTML=loginBox('forgot')">نسيت كلمة المرور؟</span></div><button class="btn" onclick="show('app')">دخول</button>`;
}
function show(w){$('login').style.display=w==='login'?'flex':'none';$('app').style.display=w==='app'?'flex':'none';if(w==='login')$('lbox').innerHTML=loginBox('login');else go('overview')}

const S={
overview:()=>head('نظرة عامة','وضع عملائك الآن: التجارب، المشتركون الفعّالون، والعقود القريبة من الانتهاء')+`<div class="kp"><div><span>طلبات بانتظار التأكيد</span><b>3</b></div><div><span>عملاء في فترة التجربة</span><b>4</b></div><div><span>مشتركون فعّالون</span><b>12</b></div><div><span>عقود تنتهي خلال 60 يوماً</span><b class="bad">2</b></div><div><span>اشتراكات منتهية</span><b>1</b></div><div><span>الإيراد السنوي (قبل الضريبة)</span><b>19,600 ر.س</b></div></div>
<div class="card warn"><b style="font-size:14px">عقود قاربت الانتهاء</b>${tbl(['المنشأة','الباقة','ينتهي في','المتبقي'],[['مؤسسة الجود','الأساسية','2026-10-04',soon(6)],['شركة الأفق التجارية','المتقدمة','2026-11-15',soon(48)]])}</div>
<div class="card"><b style="font-size:14px">عملاء في فترة التجربة</b>${tbl(['المنشأة','الباقة','تنتهي التجربة','المتبقي'],[['مكتب الرياض للهندسة','الأساسية','2026-10-01',soon(3)],['مطعم السرايا','الأساسية','2026-10-09',soon(11)],['شركة النور للمقاولات','المتقدمة','2026-10-11',soon(13)]])}</div>`,
leads:()=>head('صندوق الطلبات','عرض السعر يُصدر ويُرسل تلقائياً عند التسجيل، وأنت تؤكد الاشتراك بعد وصول إيصال التحويل')+`<div class="card"><div class="lead"><b>منشأة الرياض للتجارة</b> <span class="pill">بانتظار التأكيد</span><br><small>خالد السبيعي · 0500000000 · الباقة المتقدمة · اشتراك · <b>كود الخصم: WELCOME10</b></small><br><small>عرض السعر JFQ20260928002 — الإجمالي شامل الضريبة 2,070 ر.س (خصم 10٪)</small>
<div class="frm" style="margin-top:12px;background:var(--bg);padding:12px;border-radius:11px"><div><label>الباقة</label><select><option>المتقدمة</option></select></div><div><label>مدة الاشتراك (أشهر)</label><input value="12"></div><div><label>الخصم قبل الضريبة — كود WELCOME10</label><input value="200"></div><div><label>المبلغ المستلم شامل الضريبة</label><input value="2070"></div><div><label>تاريخ الاستلام</label><input value="2026-09-28"></div><button class="gold" onclick="alertMsg()">تأكيد الاشتراك وتوليد العقد</button></div></div></div>`,
tenants:()=>head('العملاء المشتركون','كل الشركات المسجّلة وحالة اشتراكها — مع التجديد وتحويل التجربة إلى اشتراك')+tabs(['الكل','فعّالون','تجربة','قاربت الانتهاء','منتهية'])+`<div class="card">${tbl(['المنشأة','الباقة','ينتهي','الحالة','إجراء'],[['شركة الأفق التجارية','المتقدمة','2026-11-15','<span class="pill ok">ACTIVE</span>','<button class="gold" onclick="alertMsg()">تجديد</button>'],['مؤسسة الجود','الأساسية','2026-10-04','<span class="pill ok">ACTIVE</span>','<button class="gold" onclick="alertMsg()">تجديد</button>'],['مكتب الرياض للهندسة','الأساسية','2026-10-01','<span class="pill">TRIAL</span>','<button class="gold" onclick="alertMsg()">تحويل لاشتراك</button>'],['مؤسسة السلام','الأساسية','2026-08-12','<span class="pill bad">EXPIRED</span>','<button class="gold" onclick="alertMsg()">تجديد</button>']])}</div>`,
codes:()=>head('أكواد الخصم','العميل يكتب الكود عند التسجيل، فيظهر الخصم في عرض السعر وفي العقد. الخصم يُحسب قبل الضريبة.')+`<div class="card"><div class="frm"><div><label>الكود (فارغ = توليد تلقائي)</label><input dir="ltr" placeholder="WELCOME10"></div><div><label>النوع</label><select><option>نسبة مئوية ٪</option><option>مبلغ ثابت (ر.س)</option></select></div><div><label>النسبة ٪</label><input value="10"></div><div><label>الباقة</label><select><option>كل الباقات</option><option>الأساسية</option><option>المتقدمة</option></select></div><div><label>أقصى استخدامات</label><input placeholder="بلا حد"></div><div><label>ينتهي في</label><input placeholder="2026-12-31"></div><button class="gold" onclick="alertMsg()">إنشاء كود خصم</button></div></div>
<div class="card">${tbl(['الكود','الخصم','الباقة','الاستخدام','ينتهي','الحالة',''],[['<b dir="ltr">WELCOME10</b>','10٪','الكل','7 / 50','2026-12-31','<span class="pill ok">فعّال</span>','<span class="lnk">تعطيل</span>'],['<b dir="ltr">RAMADAN200</b>','200 ر.س','المتقدمة','3','2026-04-01','<span class="pill bad">معطّل</span>','<span class="lnk">تفعيل</span>'],['<b dir="ltr">K7M2PQ9X</b>','15٪','الأساسية','0 / 5','—','<span class="pill ok">فعّال</span>','<span class="lnk">حذف</span>']])}</div>`,
revenue:()=>head('الإيرادات','ملخص الاشتراكات وقائمة التدفق النقدي')+`<div class="kp"><div><span>إجمالي العملاء</span><b>17</b></div><div><span>مشتركون فعّالون</span><b>12</b></div><div><span>في فترة تجربة</span><b>4</b></div><div><span>الإيراد السنوي (فعّالة)</span><b>19,600 ر.س</b></div><div><span>إجمالي المبالغ المستلمة</span><b>22,540 ر.س</b></div></div><div class="card"><b style="font-size:14px">قائمة التدفق النقدي (الدفعات المستلمة)</b>${tbl(['التاريخ','المنشأة','المبلغ','المرجع'],[['28/09/2026','منشأة الرياض للتجارة','2,070 ر.س','STC-88412'],['21/09/2026','شركة الأفق التجارية','2,300 ر.س','STC-88097'],['03/09/2026','مؤسسة الجود','1,380 ر.س','STC-87310']])}</div>`
};
const NAV=[['overview','نظرة عامة'],['leads','صندوق الطلبات'],['tenants','العملاء المشتركون'],['codes','أكواد الخصم'],['revenue','الإيرادات']];
function go(k){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('view').innerHTML=S[k]();window.scrollTo(0,0)}
$('nav').innerHTML=NAV.map(n=>`<button data-k="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
show('login');
</script>
</body>
</html>
