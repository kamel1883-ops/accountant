<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>جداره Finance</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #151340; }
  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .row { display: flex; align-items: center; gap: 36px; }
  .crown {
    width: 168px; height: 168px; border-radius: 36px; background: #151340;
    border: 4px solid #C6A15B; display: flex; align-items: center; justify-content: center; flex: none;
  }
  .crown svg { width: 96px; height: 96px; }
  b { display: block; font-size: 92px; font-weight: 800; line-height: 1; letter-spacing: 0; }
  small { display: block; margin-top: 16px; color: #C6A15B; font-size: 36px; font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <span class="crown">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C6A15B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8l4 4 5-7 5 7 4-4-2 10H5L3 8z"/>
        <path d="M6 20h12"/>
      </svg>
    </span>
    <div>
      <b>جداره Finance</b>
      <small>للمحاسبة المالية</small>
    </div>
  </div>
</body>
</html>
