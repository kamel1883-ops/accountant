<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جداره Finance — معاينة النظام</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E1B4B;--navy3:#151340;--gold:#C6A15B;--gold2:#E7D6AD;--soft:#F3E9D2;--bg:#F6F5F1;--sf:#fff;--tx:#1E1B33;--mu:#6C6A82;--ln:#E7E5DE;--ok:#1E7A52;--bad:#B3492B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131226;--sf:#1C1A3A;--tx:#EFEEF7;--mu:#A6A3C2;--ln:#332F5C;--soft:#2E2850}}
:root[data-theme="dark"]{--bg:#131226;--sf:#1C1A3A;--tx:#EFEEF7;--mu:#A6A3C2;--ln:#332F5C;--soft:#2E2850}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal','DejaVu Sans',system-ui,sans-serif;min-height:100vh}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:30px;width:100%;max-width:380px}
.logo{width:50px;height:50px;border-radius:13px;background:var(--navy);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.box h1{text-align:center;margin:0;font-size:19px}.box .s{text-align:center;color:var(--mu);font-size:12px;margin:2px 0 18px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;font-size:13.5px;margin-bottom:12px}
.btn{width:100%;background:var(--gold);color:var(--navy);font-weight:800;border:0;border-radius:9px;padding:11px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.lnk{font-size:12px;color:var(--mu);text-decoration:underline;cursor:pointer}
.hint{background:var(--soft);border-radius:9px;padding:9px 12px;font-size:12px;margin-top:14px;text-align:center}
.app{display:flex;min-height:100vh}
aside{width:232px;flex:0 0 232px;background:var(--navy);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.br{display:flex;align-items:center;gap:10px}.br .lg{width:38px;height:38px;border-radius:10px;background:var(--navy3);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center}
.br b{font-size:15px;display:block;line-height:1.2}.br small{color:var(--gold2);font-size:11px}
nav{display:flex;flex-direction:column;gap:2px}nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-size:13.5px;color:rgba(255,255,255,.82)}
nav button:hover{background:rgba(255,255,255,.08)}nav button.on{background:var(--gold);color:var(--navy);font-weight:800}
.langbtn{border:1px solid rgba(255,255,255,.25);background:none;color:rgba(255,255,255,.85);border-radius:8px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;margin-top:auto}
.langbtn:hover{background:rgba(255,255,255,.1)}
.prbtn{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:9px;padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.out{margin-top:8px;font-size:12px;color:rgba(255,255,255,.55);text-decoration:underline;cursor:pointer}
main{flex:1;padding:24px 28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.chip{font-size:12px;background:var(--soft);border-radius:20px;padding:4px 12px}
h2{margin:0;font-size:21px}.sub{color:var(--mu);font-size:13px;margin:2px 0 16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:16px 18px;margin-bottom:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kp div{background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:14px}.kp span{color:var(--mu);font-size:12px}.kp b{display:block;font-size:20px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500;font-size:12px}
.pill{font-size:11.5px;font-weight:800;padding:2px 10px;border-radius:20px;background:var(--soft)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:9px;padding:7px 15px;font:inherit;font-size:13px;cursor:pointer}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}.frm input,.frm select{margin:0}
.gb{background:var(--gold);color:var(--navy);font-weight:800;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-size:13px;cursor:pointer}
.pos{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start}
.pp{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:right;cursor:pointer;font:inherit;color:var(--tx)}.pp:hover{border-color:var(--gold)}.pp small{color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:8px}.bars i{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-style:normal;font-size:11px;color:var(--mu)}.bars u{width:100%;border-radius:5px 5px 0 0;background:var(--gold);display:block}.bars u.p{background:var(--navy)}
.pair{display:flex;gap:3px;align-items:flex-end;width:100%}
.frx{background:var(--bg);border:1px dashed var(--ln);border-radius:9px;padding:10px 12px;font-size:12.5px}.frx div{display:flex;justify-content:space-between;padding:3px 0}.frx .t{border-top:1px solid var(--ln);margin-top:4px;padding-top:6px;font-weight:800}

.note{font-size:11.5px;color:var(--mu);margin-top:14px;text-align:center}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln);font-size:13px}
.ln.b{font-weight:800}.ln.t{border-top:2px solid var(--navy);border-bottom:0;margin-top:4px;padding-top:8px}
.ln.i{color:var(--mu);padding-inline-start:16px;font-size:12.5px}
.ln span:last-child{font-family:ui-monospace,monospace;direction:ltr}
.res{display:flex;justify-content:space-between;background:var(--navy);color:#fff;border-radius:10px;padding:11px 14px;font-weight:800;margin-top:8px}
.res span:last-child{font-family:ui-monospace,monospace;direction:ltr;font-size:17px;color:var(--gold2)}
.ok2{color:var(--ok);font-weight:800;font-size:13px;margin-top:10px}
.bad2{color:var(--bad);font-weight:800;font-size:13px;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.hd{background:var(--soft);border-radius:7px;padding:4px 9px;font-size:13px;font-weight:800;margin:10px 0 4px}
.mono{font-family:ui-monospace,monospace;direction:ltr}
.tree td:first-child{font-size:13px}
.gp{font-weight:800}
.badge{font-size:10px;background:var(--soft);color:var(--navy);border-radius:20px;padding:1px 7px;margin-inline-start:6px}
.card5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.card5 button{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:11px;text-align:right;cursor:pointer;font:inherit;color:var(--tx)}
.card5 button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card5 small{display:block;opacity:.7;font-size:11px}.card5 b{font-size:13.5px}
@media(max-width:820px){.two{grid-template-columns:1fr}.card5{grid-template-columns:repeat(2,1fr)}}

@media(max-width:820px){.app{flex-direction:column}aside{width:100%;flex:none;flex-direction:row;overflow-x:auto;align-items:center;padding:10px}.br{flex:0 0 auto}nav{flex-direction:row}nav button{white-space:nowrap}.out{display:none}main{padding:16px}.pos{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="center"><div class="box">
  <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C6A15B" stroke-width="1.6"><path d="M3 8l4 4 5-7 5 7 4-4-2 10H5L3 8z"/><path d="M6 20h12"/></svg></div>
  <h1>جداره Finance</h1><div class="s">للمحاسبة المالية</div>
  <label>البريد الإلكتروني</label><input type="email" value="admin@alayna.example" dir="ltr">
  <label>كلمة المرور</label><input type="password" value="••••••••••" dir="ltr">
  <div style="margin-bottom:14px"><span class="lnk" onclick="toast('في النظام الفعلي: يصلك رابط استعادة كلمة المرور على بريدك')">نسيت كلمة المرور؟</span></div>
  <button class="btn" onclick="enter()">تسجيل الدخول</button>
  <p style="text-align:center;font-size:12px;color:var(--mu);margin:14px 0 0">ما عندك حساب؟ <span class="lnk" style="color:var(--navy);font-weight:800" onclick="toast('في النظام الفعلي: صفحة إنشاء حساب + إصدار عرض السعر تلقائياً')">أنشئ حساباً</span></p>
  <div id="toast" class="hint" style="display:none"></div>
  <div class="hint" style="background:transparent;border:1px dashed var(--ln)">معاينة بيانات تجريبية — اضغط «تسجيل الدخول» لدخول حساب منشأة العيّنة</div>
</div></div>

<div id="app" class="app" style="display:none">
  <aside>
    <div class="br"><span class="lg"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C6A15B" stroke-width="1.6"><path d="M3 8l4 4 5-7 5 7 4-4-2 10H5L3 8z"/></svg></span><span><b>جداره</b><small>للمحاسبة المالية</small></span></div>
    <nav id="nav"></nav><button class="langbtn" id="lang" onclick="toggleLang()">English</button><span class="out" onclick="leave()">تسجيل الخروج</span>
  </aside>
  <main><div class="top"><span class="chip">منشأة العيّنة التجارية · الفرع الرئيسي</span><span class="chip">المدير: محمّد العبدالله</span></div><div id="view"></div></main>
</div>

<script>
const $=id=>document.getElementById(id);
const tbl=(h,r)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const frm=(f,btn)=>`<div class="card"><div class="frm">${f.map(x=>`<div><label>${x[0]}</label>${x[1]?`<select>${x[1].map(o=>`<option>${o}</option>`).join('')}</select>`:`<input placeholder="${x[2]||''}">`}</div>`).join('')}<button class="gb" onclick="toast2()">${btn}</button></div></div>`;
const ok='<span class="pill ok">مُعتمد</span>', dr='<span class="pill">مسودة</span>';
const head=(t,s)=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h2>${T(t)}</h2><p class="sub">${s}</p></div><button class="prbtn" onclick="window.print()">🖨 ${T('طباعة')}</button></div>`;
const tabs=(a)=>`<div class="tabs">${a.map((x,i)=>`<button class="${i?'':'on'}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${x}</button>`).join('')}</div>`;

const P=[['كرسي مكتبي',450],['طاولة اجتماعات',1800],['شاشة 27 بوصة',900],['لوحة مفاتيح',120],['ماوس لاسلكي',85],['طابعة ليزر',1300]];
let cart={};
const S={
dash:()=>head('لوحة التحكم','نظرة سريعة على وضع منشأتك المالي')+`<div class="kp"><div><span>مبيعات الشهر</span><b>184,500 ر.س</b></div><div><span>مشتريات الشهر</span><b>61,400 ر.س</b></div><div><span>ضريبة المخرجات</span><b>27,675 ر.س</b></div><div><span>ضريبة المدخلات</span><b>9,210 ر.س</b></div><div><span>ميزان المراجعة</span><b class="ok">متوازن ✓</b></div></div>
<div class="card"><b style="font-size:14px">المبيعات والمشتريات — آخر 6 أشهر</b><div class="bars">${[['2026-04',60,30],['2026-05',75,40],['2026-06',55,35],['2026-07',90,45],['2026-08',100,50],['2026-09',85,38]].map(m=>`<i><span class="pair"><u style="height:${m[1]}px"></u><u class="p" style="height:${m[2]}px"></u></span>${m[0]}</i>`).join('')}</div><p class="sub" style="margin:8px 0 0"><span style="color:var(--gold)">■</span> مبيعات &nbsp; <span style="color:var(--navy)">■</span> مشتريات</p></div>
<div class="card"><b style="font-size:14px">آخر الحركات</b>${tbl(['المستند','الطرف','المبلغ','الحالة'],[['فاتورة مبيعات','شركة الأفق التجارية','12,650',ok],['فاتورة مشتريات','مؤسسة النخبة','5,750',ok],['سند قبض','شركة الأفق التجارية','12,650',ok],['عرض سعر','مكتب الرياض للهندسة','8,280',dr]])}</div>`,
pos:()=>head('نقطة البيع (POS)','بيع سريع: يخصم المخزون ويرحّل الفاتورة والقيد ويسجّل التحصيل بضغطة واحدة')+`<div class="pos"><div class="pg">${P.map((p,i)=>`<button class="pp" onclick="add(${i})"><b>${p[0]}</b><br><small>${p[1]} ر.س</small></button>`).join('')}</div><div class="card" id="cart"></div></div>`,
sales:()=>head('المبيعات','عروض أسعار، أوامر بيع، فواتير، ومرتجعات — تُحفظ مسودة ثم تُعتمد')+tabs(['عرض سعر','أمر بيع','فاتورة مبيعات','مرتجع مبيعات'])+frm([['اسم العميل',0,'شركة الأفق التجارية'],['المستودع',['المستودع الرئيسي','مستودع الرياض']],['الصنف',['كرسي مكتبي','طاولة اجتماعات','شاشة 27 بوصة']],['الكمية',0,'1']],'حفظ كمسودة')+`<div class="card">${tbl(['العميل','الإجمالي','الحالة'],[['شركة الأفق التجارية','12,650',ok],['مكتب الرياض للهندسة','8,280',dr],['مؤسسة الجود','3,450',ok]])}</div>`,
purchases:()=>head('المشتريات','طلبات شراء، أوامر شراء، فواتير، ومرتجعات')+tabs(['طلب شراء','أمر شراء','فاتورة مشتريات','مرتجع مشتريات'])+frm([['اسم المورد',0,'مؤسسة النخبة'],['المستودع',['المستودع الرئيسي','مستودع الرياض']],['الصنف',['شاشة 27 بوصة','لوحة مفاتيح']],['الكمية',0,'10']],'حفظ كمسودة')+`<div class="card">${tbl(['المورد','الإجمالي','الحالة'],[['مؤسسة النخبة','5,750',ok],['شركة التقنية المتقدمة','14,950',dr]])}</div>`,
accounts:()=>head('دليل الحسابات','هيكل ثنائي اللغة (عربي / English) بمعيار قياسي')+`<div class="card">${tbl(['الرقم','الاسم بالعربي','Name','النوع'],[['1000','الأصول','Assets','رئيسي'],['1101','النقدية وما في حكمها','Cash and cash equivalents','فرعي'],['1103','العملاء','Accounts receivable','فرعي'],['1104','المخزون','Inventory','فرعي'],['2102','ضريبة القيمة المضافة المستحقة','VAT payable','فرعي'],['3101','رأس المال','Capital','فرعي'],['4101','إيرادات المبيعات','Sales revenue','فرعي'],['5102','الرواتب والأجور','Salaries and wages','فرعي']])}</div>`,
journal:()=>head('القيود اليومية','يجب أن يتساوى المدين مع الدائن قبل الحفظ')+frm([['التاريخ',0,'2026-09-28'],['البيان',0,'قيد افتتاحي'],['الحساب',['1101 النقدية','3101 رأس المال']],['مدين',0,'50,000'],['دائن',0,'0']],'إضافة سطر')+`<div class="card"><p class="sub" style="margin:0 0 8px">مدين: <b class="ok">50,000</b> — دائن: <b class="bad">0</b> — <span class="pill bad">غير متوازن</span></p>${tbl(['التاريخ','البيان','المصدر'],[['2026-09-27','فاتورة مبيعات — شركة الأفق','<span class="pill">تلقائي</span>'],['2026-09-26','سند قبض — شركة الأفق','<span class="pill">تلقائي</span>'],['2026-09-20','قيد افتتاحي','يدوي']])}</div>`,
invoices:()=>head('الفواتير (قديم)','إدخال سريع لفاتورة بدون أصناف — الضريبة 15٪ تُحسب تلقائياً')+frm([['النوع',['مبيعات','مشتريات']],['الطرف',0,'اسم العميل / المورد'],['المبلغ قبل الضريبة',0,'1000']],'حفظ الفاتورة')+`<p class="sub">الضريبة: 150.00 — الإجمالي: 1,150.00 ر.س</p>`,
products:()=>head('المنتجات','الأصناف والتصنيفات ووحدات القياس')+frm([['رمز الصنف SKU',0,'CH-001'],['اسم الصنف',0,'كرسي مكتبي'],['التصنيف',['أثاث','إلكترونيات']],['الوحدة',['قطعة','كرتون']],['سعر البيع',0,'450']],'إضافة منتج')+`<div class="card">${tbl(['SKU','الاسم','التصنيف','البيع','الرصيد'],[['CH-001','كرسي مكتبي','أثاث','450','42'],['MO-027','شاشة 27 بوصة','إلكترونيات','900','6 <span class="bad">⚠️ منخفض</span>'],['KB-010','لوحة مفاتيح','إلكترونيات','120','58']])}</div>`,
warehouses:()=>head('الفروع والمستودعات','كل مستودع يتبع فرعاً — أساس الفروع المتعددة')+`<div class="card"><b style="font-size:14px">الفروع</b><p><span class="pill">الفرع الرئيسي (رئيسي)</span> <span class="pill">فرع جدة</span></p></div><div class="card">${tbl(['المستودع','الفرع'],[['المستودع الرئيسي','الفرع الرئيسي'],['مستودع الرياض','الفرع الرئيسي'],['مستودع جدة','فرع جدة']])}</div>`,

const T=x=>LANG==='en'?(TR[x]||x):x;
// ترجمة نصوص DOM: مطابقة كاملة أولاً، ثم استبدال العبارات الجزئية (مثل «ر.س» داخل مبلغ)
const PARTIAL=[['ر.س','SAR'],['يوم','days'],['٪',' %']];
function trText(v){
 const k=v.trim(); if(!k)return v;
 if(TR[k])return v.replace(k,TR[k]);
 let out=v, changed=false;
 for(const [a,b] of Object.entries(TR)){ if(a.length>6 && out.includes(a)){ out=out.split(a).join(b); changed=true; } }
 for(const [a,b] of PARTIAL){ if(out.includes(a)){ out=out.split(a).join(b); changed=true; } }
 return changed?out:v;
}
function trNode(root){ if(LANG!=='en')return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const hits=[]; while(w.nextNode())hits.push(w.currentNode);
 hits.forEach(n=>{ const nv=trText(n.nodeValue); if(nv!==n.nodeValue)n.nodeValue=nv; });
 root.querySelectorAll('[placeholder]').forEach(e=>{const tr=TR[e.getAttribute('placeholder').trim()]; if(tr)e.setAttribute('placeholder',tr);});
}
function toggleLang(){LANG=LANG==='ar'?'en':'ar';
 document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
 $('lang').textContent=LANG==='ar'?'English':'العربية';
 document.querySelector('.br small').textContent=T('للمحاسبة المالية');
 document.querySelector('.out').textContent=T('تسجيل الخروج');
 document.querySelectorAll('.top .chip').forEach(c=>{const tr=TR[c.textContent.trim()];if(tr)c.textContent=tr;});
 renderNav();go(CUR);}
let CUR='dash';
function renderNav(){$('nav').innerHTML=NAV.map(n=>`<button data-k="${n[0]}" onclick="go('${n[0]}')">${T(n[1])}</button>`).join('');}

const NAV=[['dash','لوحة التحكم'],['pos','نقطة البيع'],['sales','المبيعات'],['purchases','المشتريات'],['accounts','دليل الحسابات'],['journal','القيود اليومية'],['trial','ميزان المراجعة'],['statements','القوائم المالية'],['products','المنتجات'],['warehouses','الفروع والمستودعات'],['stock','جرد المخزون'],['finance','المالية'],['reports','التقارير'],['periods','الفترات المالية'],['vat','الإقرار الربعي'],['zakat','الزكاة'],['health','فحص سلامة البيانات']];
function go(k){CUR=k;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('view').innerHTML=S[k]();trNode($('view'));if(k==='pos')drawCart();if(k==='statements'){$('stBox').innerHTML=ST.inc();trNode($('stBox'));}window.scrollTo(0,0)}
renderNav();
function enter(){$('login').style.display='none';$('app').style.display='flex';go('dash')}
function leave(){$('app').style.display='none';$('login').style.display='flex'}

function add(i){cart[i]=(cart[i]||0)+1;drawCart()}
function drawCart(){const el=$('cart');if(!el)return;const rows=Object.keys(cart);const sub=rows.reduce((s,i)=>s+P[i][1]*cart[i],0),v=sub*.15;
el.innerHTML=`<b style="font-size:14px">سلة البيع — عميل نقدي</b>${rows.length?rows.map(i=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln);font-size:13px"><span>${P[i][0]}</span><span>× ${cart[i]}</span></div>`).join(''):'<p class="sub">اضغط على منتج لإضافته</p>'}<p class="sub" style="margin:10px 0 2px">الأساس: ${sub.toLocaleString('en-US')} — الضريبة: ${v.toLocaleString('en-US')}</p><p style="font-weight:800;font-size:17px;margin:0 0 10px">الإجمالي: ${(sub+v).toLocaleString('en-US')} ر.س</p><button class="btn" onclick="${rows.length?"cart={};drawCart();alert('تم البيع ✓ الفاتورة والقيد وسند القبض اتسجلوا تلقائياً')":"void 0"}">إتمام البيع</button>`;trNode(el)}
